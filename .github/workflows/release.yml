name: Release

# Tag-driven. Nothing publishes on a merge to main; pushing v0.2.0 is the
# deliberate act that ships 0.2.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs before anything is published. A version on PyPI can never be uploaded
  # again, so a missing release note has to stop the release here, while
  # nothing has left the repository.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A release with auto-generated notes is a changelog, not a release note.
      - name: Require written release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing, so nothing was published. Add the release notes file, move the ${TAG} tag to the commit that contains it, and re-run the workflow (pushing the moved tag re-runs it)."
            exit 1
          fi
          echo "Using $notes"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    # The environment is where the trusted-publisher binding is scoped on
    # PyPI's side, and where an approval gate can be added later.
    environment: pypi
    permissions:
      # OIDC trusted publishing. There is no API token in this repository and
      # no secret referenced anywhere in this workflow.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The notes file was required by `preflight`, before anything published.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "itest-cli $TAG" \
            --notes-file "docs/releases/${TAG}.md" \
            dist/*
