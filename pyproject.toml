[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itest-cli"
version = "0.1.0"
description = "Local-first CLI that analyzes Terraform, extracts integration points, and verifies infrastructure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
itest = "itest.cli:app"

[tool.setuptools.packages.find]
include = ["itest*"]
