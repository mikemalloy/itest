[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itest-cli"
version = "0.2.0"
description = "Local-first CLI that analyzes Terraform, extracts integration points, and verifies infrastructure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    # Terminal styling for human output only. The style layer is a colorizer
    # over the canonical strings and switches itself off when stdout is not a
    # terminal, so nothing machine-readable depends on it.
    "rich>=13",
    # Runtime, not dev: `itest verify` shells out to pytest to run the
    # generated suite, so the tool cannot function without it.
    "pytest>=8",
    # Runtime too: the MCP probe transport (itest/probes/mcp.py) speaks the
    # protocol through the official SDK and never hand-rolls a frame. Floored at
    # 2.2 because the probe uses the 2.x client surface (mcp.Client,
    # streamable_http_client(url, http_client=...)); the 1.x line differs.
    "mcp>=2.2",
]

[project.optional-dependencies]
# The reference API under examples/reference-api/ is a FastAPI app used only to
# exercise every branch of the http_probe recipe locally; it is not part of the
# CLI. Its dependencies live here so a plain `pip install itest-cli` never pulls
# a web framework it does not need. (examples/reference-mcp/ needs nothing extra:
# the MCP SDK is a runtime dependency of the probe, and brings starlette and
# uvicorn with it.)
examples = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    # Floored at 0.16 (not pinned) because 0.16 formats Python inside Markdown
    # fences: the recipes under skills/ are gated by `ruff format --check` only
    # from this version on. Contributors on anything newer must still pass.
    "ruff>=0.16",
    # The reference-API tests (tests/test_reference_app.py,
    # tests/test_reference_api.py) import the app and stand it up under uvicorn,
    # so the suite cannot run without the examples group. Mirrored here so
    # `pip install -e .[dev]` alone makes `pytest` green.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Starlette's TestClient (used by test_reference_app.py) is built on httpx.
    "httpx2>=2",
]

[project.scripts]
itest = "itest.cli:app"

[tool.setuptools.packages.find]
include = ["itest*"]

# Data the engine reads at run time through importlib.resources. Not Python, so
# setuptools leaves it out of a wheel unless it is named here.
[tool.setuptools.package-data]
"itest.traits" = ["traits.yaml"]
"itest.report" = ["templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Generated demo output must not gate lint: .itest/ and itest_tests/ are
# produced by running the quickstart, not authored here.
exclude = [".venv", ".itest", "itest_tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
# The project's own suite is tests/ and nothing else. A dry run of an example
# (itest plan/sync in examples/<name>/) generates an itest_tests/ tree that
# needs its server running; a bare `pytest` from the repo root must not
# collect it.
testpaths = ["tests"]
