# The applies-when table: which checks a declared MCP tool gets.
#
# THIS IS DATA, NOT CODE. No hardcoded dict of trait rules exists anywhere in
# the engine: `itest sync` reads this file, evaluates each `applies_when` against
# the tool's own attributes, and generates one stub per (tool, applicable trait).
# Editing one `applies_when` line here changes the generated suite — which is the
# point, and is pinned by a test.
#
# `applies_when` is a tiny expression over the tool's attributes. The whole
# grammar:
#
#   always                        the trait applies to every tool
#   <field>                       the field is truthy
#   <field> present               the field is not null
#   <field> == <value>            equality (`none`, `true`, `false`, numbers
#   <field> != <value>            and bare words are literals)
#   <field> in [<a>, <b>]         membership
#   <A> and <B> and ...           every clause must hold
#
# The fields are the tool's attributes as plan recorded them: `mutation`,
# `egress`, `approval`, `active`, `has_free_form_input`, plus the two facts its
# server declared — `auth.second_tenant_env` and `audit.sink`. An unknown field
# is an error, not a silently false clause: a typo here must not quietly delete a
# check.
#
# `tier` is what the generated stub is registered as, and it is what the
# environment policy gates on: an `active` trait's stubs go in their own file so a
# disallowed environment never even imports them.
#
# This is the minimal form. P31 formalizes it (the recipes each `recipe` names
# are its work); the shape of the file is what the engine depends on.
version: 1

# Family names, for the readiness page's roll-up. The letter is the family id.
families:
  A: Authority
  B: Blast radius
  C: Containment
  D: Change

traits:
  - id: A1
    family: A
    name: refuses anonymous
    applies_when: always
    tier: readonly
    recipe: tool_authn.md

  - id: A2
    family: A
    name: tenant isolation
    applies_when: auth.second_tenant_env present and mutation != informational
    tier: active
    recipe: tool_isolation.md

  - id: B1
    family: B
    name: mutation class
    applies_when: always
    tier: readonly
    recipe: tool_mutation_class.md

  - id: B2
    family: B
    name: destructive gating
    applies_when: mutation == destructive
    tier: active
    recipe: tool_gating.md

  - id: B3
    family: B
    name: external egress
    applies_when: egress != none
    tier: readonly
    recipe: tool_egress.md

  - id: B4
    family: B
    name: audit record
    applies_when: mutation in [write, destructive] and audit.sink present
    tier: active
    recipe: tool_audit.md

  - id: C1
    family: C
    name: parameter scope
    applies_when: mutation != informational
    tier: active
    recipe: tool_containment.md

  - id: C2
    family: C
    name: expression passthrough
    applies_when: has_free_form_input
    tier: active
    recipe: tool_containment.md

  - id: D1
    family: D
    name: inventory
    applies_when: always
    tier: readonly
    recipe: tool_provenance.md

  - id: D2
    family: D
    name: schema drift
    applies_when: always
    tier: readonly
    recipe: tool_provenance.md

  - id: D3
    family: D
    name: description drift
    applies_when: always
    tier: readonly
    recipe: tool_provenance.md
